name: PR 评审（AI）

# 建议性评审：先判「这个 PR 合不合理」，合理再评「写得怎么样」。
# 只读 diff 文本，不 checkout、不执行 PR 代码；只发评论与标签，
# 不合并、不关闭、不批准 —— 要不要关掉由维护者决定。
# 免费：没配 LLM_API_KEY 时走零密钥的免费网关；配了就用配置的模型。
# 百炼按队列跑（LLM_MODELS 可覆盖）：一个模型免费额度用完自动换下一个。
#
# 默认不自动跑。单人仓库、一天几十个提交，「每个 PR 都评一遍」的边际收益接近零，
# 而且会把 PR 的 diff 全文发给第三方模型网关（它和 App 里「日志不出本机」是两套
# 信任模型，但仍应尽量减少外发）。要评审时：在 PR 上打 `ai-review` 标签，
# 或手动 dispatch 并给出 PR 编号。
on:
  pull_request_target:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: PR 编号
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: pr-review
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-review')
      && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    steps:
      - name: 从基线取评审脚本（不执行 PR 代码）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo, sha = os.environ["REPO"], os.environ["REF"]
          dst = pathlib.Path(".review/pr_review.py")
          dst.parent.mkdir(exist_ok=True)
          url = f"https://api.github.com/repos/{repo}/contents/tools/pr_review.py?ref={sha}"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json"})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          dst.write_bytes(base64.b64decode(data["content"]))
          print(f"pr_review.py 取自 {sha} {data['sha'][:12]}")
          PY

      - name: 评审脚本自测（70 条，防止渲染、去重、预算取样、严重度分组、反馈解析、CI 结论与模型轮换逻辑被改坏）
        run: python3 .review/pr_review.py --selftest

      - name: 评审并留言
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MODELS: ${{ vars.LLM_MODELS }}
        run: |
          set +e
          python3 .review/pr_review.py --pr "$PR" --repo "$REPO" \
            --comment --ensure-labels --wait-audit 90 --summary-file review.md
          code=$?
          { echo "<!-- pr-review -->"; cat review.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          exit $code





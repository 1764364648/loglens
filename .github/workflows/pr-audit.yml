name: PR 审计

# 只跑基线（main）里的这个文件，不 checkout PR 里的任何代码，也不跑 PR 的脚本。
# 结果是两件事：一个必需的检查（pr-audit），和在 PR 里留一条会更新的人话报告 + 标签。
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-audit:
    name: pr-audit
    runs-on: ubuntu-latest
    steps:
      - name: 从基线取审计脚本、规则自测与依赖白名单（不执行 PR 代码）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo, sha = os.environ["REPO"], os.environ["BASE_SHA"]
          files = {
              "tools/pr_audit.py": ".audit/pr_audit.py",
              "tools/test_pr_audit.py": ".audit/test_pr_audit.py",
              "security/dependency-allowlist.txt": "security/dependency-allowlist.txt",
          }
          pathlib.Path(".audit").mkdir(exist_ok=True)
          pathlib.Path("security").mkdir(exist_ok=True)
          for src, dst in files.items():
              url = f"https://api.github.com/repos/{repo}/contents/{src}?ref={sha}"
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json"})
              data = json.load(urllib.request.urlopen(req, timeout=30))
              pathlib.Path(dst).write_bytes(base64.b64decode(data["content"]))
              print(f"{src} 取自基线提交 {data['sha'][:12]}")
          PY

      - name: 规则自测（50 条用例，防止规则被改坏）
        run: python3 .audit/test_pr_audit.py

      - name: 审计 PR diff 并在 PR 里留言
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python3 .audit/pr_audit.py --pr "$PR" --repo "$REPO" --summary-file audit.md --comment
          code=$?
          { echo "<!-- pr-audit -->"; cat audit.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

name: 提个需求
description: 想要的功能、用起来别扭的地方、文案与交互建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看一眼 [README 的功能清单](https://github.com/1764364648/loglens#readme) 和「已知限制」，有些事是这个工具故意不做的（比如免 Shizuku 抓别人的日志、上架应用商店）。

  - type: textarea
    id: want
    attributes:
      label: 想要什么
      description: 一句话说清最终效果，别从实现方案讲起
      placeholder: 想按「崩溃今天第一次出现的时间」排序，而不是按发生次数
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 什么场景下需要
      description: 你现在碰到的是哪个具体麻烦，多久碰一次
      placeholder: 每天收 bug 报告，同一类崩溃会重复几十条，按次数排会把新的挤到后面
    validations:
      required: true

  - type: textarea
    id: now
    attributes:
      label: 现在怎么凑合
      description: 当前用什么办法绕过去，或者只能忍着
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 大概属于哪一块
      options:
        - 日志显示与筛选
        - 崩溃聚合
        - 落盘与导出
        - 悬浮窗与采集控制
        - 工具箱（诊断 / 取证 / 网络快照 / 反馈）
        - 界面与文案
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: offer
    attributes:
      label: 你愿意做什么
      options:
        - label: 可以帮忙试装验证（提供机型与结果）
        - label: 可以提 PR
        - label: 只是提个想法，不参与
